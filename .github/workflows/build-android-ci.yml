name: Android CI
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        id: setup-gradle
        with:
          cache-provider: basic

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build for Android
        run: ./gradlew assembleDebug

      - name: Rename apk for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OmniRCM-android.apk

      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK
        # ID used to access action output
        id: sign_app
        with:
          releaseDirectory: ${{ github.workspace }}/android/app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OmniRCM-android.apk
          path: ${{steps.sign_app.outputs.signedReleaseFile}}
          archive: false