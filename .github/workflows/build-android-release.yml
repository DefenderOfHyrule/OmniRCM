name: Android Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        id: setup-gradle
        with:
          cache-provider: basic
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build for Android
        run: ./gradlew assembleDebug

      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK
        # ID used to access action output
        id: sign_app
        with:
          releaseDirectory: ${{ github.workspace }}/android/app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename apk for release
        run: mv ${{steps.sign_app.outputs.signedReleaseFile}} /tmp/OmniRCM-android.apk

      - name: Publish to draft release
        uses: softprops/action-gh-release@v2
        with:
          name: OmniRCM ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: /tmp/OmniRCM-android.apk